{% extends "admin/base_site.html" %}{% block content %}<h1>Reporte de ventas</h1><form>{% csrf_token %}<label>Desde <input type="date" name="desde" value="{{ desde }}"></label><label>Hasta <input type="date" name="hasta" value="{{ hasta }}"></label><button>Filtrar</button><button name="exportar" value="1">Exportar CSV</button></form><p>Ventas: {{ cantidad }} | Total: {{ total }}</p><table><tr><th>ID</th><th>Fecha</th><th>Cliente</th><th>Total</th></tr>{% for venta in ventas %}<tr><td>{{ venta.id }}</td><td>{{ venta.fecha }}</td><td>{{ venta.cliente }}</td><td>{{ venta.total }}</td></tr>{% endfor %}</table>{% endblock %}
