{% extends "base.html" %}{% block content %}<h1>Ventas</h1><a class="btn btn-primary mb-3" href="{% url 'inventario:venta-create' %}">Nueva venta</a>
<form class="mb-3">Desde <input type="date" name="desde" value="{{ request.GET.desde }}"> Hasta <input type="date" name="hasta" value="{{ request.GET.hasta }}"><button>Filtrar</button></form>
<table class="table"><tr><th>ID</th><th>Fecha</th><th>Cliente</th><th>Total</th><th></th></tr>{% for venta in ventas %}<tr><td><a href="{% url 'inventario:venta-detail' venta.pk %}">#{{ venta.pk }}</a></td><td>{{ venta.fecha }}</td><td>{{ venta.cliente }}</td><td>{{ venta.total }}</td><td><a href="{% url 'inventario:venta-update' venta.pk %}">Editar</a></td></tr>{% empty %}<tr><td colspan="5">No hay ventas.</td></tr>{% endfor %}</table>{% include "inventario/pagination.html" %}{% endblock %}
