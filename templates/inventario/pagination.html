{% if is_paginated %}<nav><ul class="pagination">{% if page_obj.has_previous %}<li><a href="?{{ pagination_query }}{% if pagination_query %}&{% endif %}page={{ page_obj.previous_page_number }}">Anterior</a></li>{% endif %}<li class="page-item"><span class="page-link">{{ page_obj.number }}/{{ page_obj.paginator.num_pages }}</span></li>{% if page_obj.has_next %}<li><a href="?{{ pagination_query }}{% if pagination_query %}&{% endif %}page={{ page_obj.next_page_number }}">Siguiente</a></li>{% endif %}</ul></nav>{% endif %}
