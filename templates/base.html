{% load static %}
<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}La Tiendita{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-primary mb-4"><div class="container">
<a class="navbar-brand" href="{% url 'inventario:producto-list' %}">La Tiendita</a>
{% if user.is_authenticated %}<a class="btn btn-light" href="{% url 'logout' %}">Cerrar sesión</a>{% endif %}
</div></nav>
<main class="container">
{% for message in messages %}<div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>{% endfor %}
{% block content %}{% endblock %}
</main>
<script>
document.addEventListener("keydown", function (event) {
    if (event.target.matches('input[type="number"]') && ["e", "E", "+", "-", "."].includes(event.key)) {
        event.preventDefault();
    }
});
document.addEventListener("paste", function (event) {
    if (!event.target.matches('input[type="number"]')) {
        return;
    }
    setTimeout(function () {
        event.target.value = event.target.value.replace(/[^\d]/g, "");
    }, 0);
});
</script>
</body></html>
