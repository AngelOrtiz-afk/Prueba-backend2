{% load static %}
<!doctype html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}La Tiendita{% endblock %}</title>
    <script>
    (function () {
        try {
            document.documentElement.setAttribute("data-bs-theme", localStorage.getItem("site-theme") || "dark");
        } catch (error) {
            document.documentElement.setAttribute("data-bs-theme", "dark");
        }
    }());
    </script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛒</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'css/site.css' %}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark site-navbar shadow-sm">
    <div class="container site-container">
        <a class="navbar-brand fw-semibold" href="{% url 'inventario:producto-list' %}">La Tiendita</a>
        {% if user.is_authenticated %}
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#siteNavigation" aria-label="Abrir navegación"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="siteNavigation">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link {% if 'venta-' in request.resolver_match.url_name %}active{% endif %}" href="{% url 'inventario:venta-list' %}">Ventas</a></li>
            </ul>
            <div class="d-flex align-items-center gap-2">
                <button class="btn btn-outline-light btn-sm theme-toggle" type="button" id="theme-toggle" aria-label="Cambiar tema" title="Cambiar tema">
                    <span aria-hidden="true">◐</span><span class="visually-hidden">Cambiar tema</span>
                </button>
                <a class="btn btn-outline-light btn-sm" href="{% url 'logout' %}">Cerrar sesión</a>
            </div>
        </div>
        {% else %}
        <button class="btn btn-outline-light btn-sm theme-toggle" type="button" id="theme-toggle" aria-label="Cambiar tema" title="Cambiar tema">
            <span aria-hidden="true">◐</span><span class="visually-hidden">Cambiar tema</span>
        </button>
        {% endif %}
    </div>
</nav>
<main class="container site-container py-4">
    {% for message in messages %}
    <div class="alert {% if 'success' in message.tags %}alert-success{% elif 'error' in message.tags %}alert-danger{% else %}alert-info{% endif %} alert-dismissible fade show" role="alert">
        {{ message }}<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>
    {% endfor %}
    {% block content %}{% endblock %}
</main>
<script>
document.addEventListener("DOMContentLoaded", function () {
    const toggle = document.getElementById("theme-toggle");
    if (!toggle) return;
    toggle.addEventListener("click", function () {
        const nextTheme = document.documentElement.getAttribute("data-bs-theme") === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-bs-theme", nextTheme);
        try {
            localStorage.setItem("site-theme", nextTheme);
        } catch (error) {
            // Keep the current theme for this page when storage is unavailable.
        }
    });
});
document.addEventListener("DOMContentLoaded", function () {
    document.querySelectorAll(".alert").forEach(function (alert) {
        setTimeout(function () {
            bootstrap.Alert.getOrCreateInstance(alert).close();
        }, 5000);
    });
});
document.addEventListener("keydown", function (event) {
    if (event.target.matches('input[type="number"]') && ["e", "E", "+", "-", "."].includes(event.key)) event.preventDefault();
});
document.addEventListener("paste", function (event) {
    if (!event.target.matches('input[type="number"]')) return;
    setTimeout(function () { event.target.value = event.target.value.replace(/[^\d]/g, ""); }, 0);
});
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
